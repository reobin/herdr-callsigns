id = "herdr-callsigns"
name = "Callsigns"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Auto-name every herdr pane with a short memorable callsign. Teach agents to resolve pane names and labels to pane IDs"
platforms = ["linux", "macos"]

[[startup]]
command = ["sh", "scripts/name.sh"]

[[events]]
on = "pane.created"
command = ["sh", "scripts/name.sh"]

[[actions]]
id = "install-skill"
title = "Install agent skill"
description = "Copy the herdr-callsigns skill into this machine's agent skill directories"
command = ["sh", "install-skill.sh"]
